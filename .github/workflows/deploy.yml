name: Deploy veronica (nucleo)

# Corre en infraestructura de GitHub (no pasa por el proxy de red de las
# sesiones de Claude, que bloquea api.cloudflare.com y *.workers.dev por
# politica de organizacion). Requiere un secret de repo CLOUDFLARE_API_TOKEN
# (Settings -> Secrets and variables -> Actions -> New repository secret),
# el mismo token de CREDENCIALES.md. Sin ese secret, este workflow falla
# con un error claro en vez de desplegar a medias.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run typecheck
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN en este repo (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          npx wrangler deploy
